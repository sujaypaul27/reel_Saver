name: reel_saver
description: "A Flutter project for downloading Instagram reels and YouTube videos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  shared_preferences: ^2.5.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  intl: ^0.20.2
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  receive_sharing_intent: ^1.9.0
  fluttertoast: ^10.0.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
